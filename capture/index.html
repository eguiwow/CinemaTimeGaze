<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KnowMan Capture</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b1029">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* One small screen: either "opening" (the normal case, shown for a moment) or "setup" (first run, or ?setup). */
:root {
  --bg: #e9ebf2; --surface: #f7f8fc; --sunk: #dfe2ec; --fg: #18204a; --muted: #545d86; --line: #c3c8dc;
  --accent: #8a6516; --accent-fg: #fffaf0; --signal: #0f6f80; --danger: #a3322b;
  --font-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1029; --surface: #131b3d; --sunk: #0e1533; --fg: #e8eaf6; --muted: #8f98c4; --line: #2a3466;
    --accent: #e0b75e; --accent-fg: #1a1405; --signal: #74d6ea; --danger: #f08a82; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1029; --surface: #131b3d; --sunk: #0e1533; --fg: #e8eaf6; --muted: #8f98c4; --line: #2a3466;
  --accent: #e0b75e; --accent-fg: #1a1405; --signal: #74d6ea; --danger: #f08a82; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
}
main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.mark { width: 64px; height: 64px; border-radius: 16px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.9rem; line-height: 1.1; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); font-size: 0.9rem; }
[hidden] { display: none !important; }
form { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 4px 4px 14px 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
label { font-size: 0.85rem; color: var(--muted); }
input { font: inherit; color: inherit; width: 100%; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
input:focus { border-color: var(--signal); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--signal) 22%, transparent); }
button, .btn {
  font: inherit; font-weight: 600; min-height: 52px; border-radius: 10px; border: 0;
  background: var(--accent); color: var(--accent-fg); cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; padding: 0 16px;
}
.link { color: var(--signal); font-size: 0.9rem; }
.err { color: var(--danger); min-height: 1.2em; font-size: 0.9rem; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--signal); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
<main>
  <img class="mark" src="icons/icon-192.png" alt="">

  <section id="opening" hidden aria-live="polite">
    <div style="display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;align-items:center;gap:12px"><div class="spinner" aria-hidden="true"></div><h1>Opening KnowMan Capture</h1></div>
      <a class="btn" id="open-now" href="#">Open now</a>
      <a class="link" href="?setup">Change the page link</a>
    </div>
  </section>

  <section id="setup" hidden>
    <div style="display:flex;flex-direction:column;gap:16px">
      <h1>Set up KnowMan Capture</h1>
      <p class="muted">Paste the link of your capture page once. This phone keeps it, and the app opens the page directly from then on.</p>
      <form id="setup-form" novalidate>
        <label for="target">Capture page link</label>
        <input id="target" name="target" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="https://claude.ai/artifact/…">
        <p class="err" id="setup-err" role="alert"></p>
        <button type="submit">Save and open</button>
      </form>
      <p class="muted" id="no-storage" hidden>This browser does not keep data for this page, so the link is not saved. The page opens this time only.</p>
    </div>
  </section>
</main>

<script>
// helpers:start
// Pure functions. The tests in tests/test_helpers.mjs read this block.

var STORAGE_KEY = "knowman-capture:target";

// A claude.ai artifact link: claude.ai/artifact/<id> or claude.ai/code/artifact/<uuid>.
var ARTIFACT_RE = /https:\/\/claude\.ai\/(?:code\/)?artifact\/[A-Za-z0-9_-]{8,64}/;

// Take pasted or shared text and return the canonical artifact URL, or "" when there is none.
// The text can hold more than the link (a share sheet often adds a title). Query and hash are dropped.
function normalizeTarget(input) {
  if (typeof input !== "string") return "";
  var s = input.trim();
  if (!s) return "";
  if (/^claude\.ai\//i.test(s)) s = "https://" + s;
  s = s.replace(/^http:\/\//i, "https://").replace(/^https:\/\/www\.claude\.ai\//i, "https://claude.ai/");
  var m = s.match(ARTIFACT_RE);
  return m ? m[0] : "";
}

// Decide what the page does on load.
// search: location.search. saved: the stored link or "".
// Returns {action: "open" | "setup", target, save}. save is true when the link came from ?to= and must be stored.
function decide(search, saved) {
  var params = new URLSearchParams(search || "");
  if (params.has("to")) {
    var t = normalizeTarget(params.get("to"));
    if (t) return { action: "open", target: t, save: true };
    return { action: "setup", target: "", save: false, error: "That is not a claude.ai artifact link." };
  }
  if (params.has("setup")) return { action: "setup", target: normalizeTarget(saved), save: false };
  var s = normalizeTarget(saved);
  if (s) return { action: "open", target: s, save: false };
  return { action: "setup", target: "", save: false };
}
// helpers:end

(function () {
  function readSaved() { try { return localStorage.getItem(STORAGE_KEY) || ""; } catch (e) { return null; } }
  function save(v) { try { localStorage.setItem(STORAGE_KEY, v); return true; } catch (e) { return false; } }

  var saved = readSaved();
  var storageOk = saved !== null;
  var d = decide(location.search, saved || "");

  function open(target) {
    document.getElementById("setup").hidden = true;
    document.getElementById("opening").hidden = false;
    document.getElementById("open-now").href = target;
    // replace, not assign: the launcher stays out of the history, so Back leaves the app instead of looping.
    location.replace(target);
  }

  if (d.action === "open") {
    if (d.save) save(d.target);
    open(d.target);
  } else {
    var setup = document.getElementById("setup");
    var input = document.getElementById("target");
    var err = document.getElementById("setup-err");
    setup.hidden = false;
    document.getElementById("no-storage").hidden = storageOk;
    if (d.target) input.value = d.target;
    if (d.error) err.textContent = d.error;
    document.getElementById("setup-form").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var t = normalizeTarget(input.value);
      if (!t) { err.textContent = "Paste a link that starts with https://claude.ai/artifact/"; input.focus(); return; }
      err.textContent = "";
      save(t);
      open(t);
    });
    if (!d.target) input.focus();
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () { /* the app still works without it */ });
  }
})();
</script>
</body>
</html>
